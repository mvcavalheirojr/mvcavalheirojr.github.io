<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Balloon Adventure</title>
<link rel="icon" href="icon.png">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: linear-gradient(#4a8fd8, #9fd0f0); font-family: 'Pixelify Sans', monospace; color: #1a141e; }
  main { background: #fff8e6; border: 4px solid #1a141e; box-shadow: 6px 6px 0 rgba(0,0,0,.25);
         padding: 28px 24px; margin: 16px; max-width: 420px; text-align: center; }
  img { width: 96px; height: 96px; image-rendering: pixelated; border: 3px solid #1a141e; }
  h1 { margin: 16px 0 4px; font-size: 32px; }
  p { margin: 8px 0 20px; }
  a { display: block; margin: 10px 0; padding: 12px; border: 3px solid #1a141e; color: #fff8e6;
      background: #4caf50; text-decoration: none; font-size: 18px; }
  a.alt { background: #7a6f8a; }
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="">
  <h1>Balloon Adventure</h1>
  <p>Um jogo de balão em pixel art para Android.<br>A pixel-art hot air balloon game for Android.</p>
  <a href="https://play.google.com/store/apps/details?id=com.balloonadventure.game">Google Play</a>
  <a class="alt" href="https://mvcavalheirojr.github.io/balloon-adventure-privacy/">Política de privacidade · Privacy policy</a>
</main>
</body>
</html>
